<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDrill 2026 - Tryout Interaktif</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0b1220;--card:#101828;--fg:#fff;--muted:#a0aec0;--accent:#d4a843;--accent-dim:rgba(212,168,67,0.15);--border:#2d3a5a;--danger:#e53e3e;--warning:#f6ad55;--success:#48bb78;--shadow:0 8px 32px rgba(0,0,0,0.5);--radius:12px;--radius-sm:8px;--transition:.25s cubic-bezier(.4,0,.2,1)}
    @media(prefers-color-scheme:light){:root{--bg:#f5f0e8;--card:#fff;--fg:#1a1a1a;--muted:#6b5b3e;--accent:#b8952e;--accent-dim:rgba(184,149,46,0.15);--border:#e8dcc8;--shadow:0 8px 32px rgba(0,0,0,0.08)}}
    html,body{height:100%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--fg);line-height:1.6}
    header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.5rem;border-bottom:1px solid var(--border);background:rgba(22,25,31,0.8);backdrop-filter:blur(12px)}
    .logo{display:flex;align-items:center;gap:.75rem;font-weight:800;font-size:1.25rem;text-decoration:none;color:var(--fg)}
    .timer{font-family:'JetBrains Mono','Fira Code',monospace;font-size:1.125rem;font-weight:600;color:var(--accent);background:var(--accent-dim);padding:.5rem 1rem;border-radius:var(--radius-sm);border:1px solid var(--border);min-width:120px;text-align:center}
    .timer.warning{color:var(--warning);background:rgba(255,165,2,0.15);border-color:var(--warning);animation:pulse 1s infinite}
    .timer.danger{color:var(--danger);background:rgba(255,71,87,0.15);border-color:var(--danger);animation:pulse .5s infinite}
    @keyframes pulse{50%{opacity:.6}}
    main{flex:1;padding:2rem 1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .step{display:none;max-width:880px;width:100%;animation:fade .35s var(--transition)}
    .step.active{display:block}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;box-shadow:var(--shadow);transition:var(--transition)}
    .card:hover{border-color:var(--accent)}
    .form-group{margin-bottom:1rem}
    .form-group label{display:block;margin-bottom:.5rem;font-size:.875rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
    .form-group input,.form-group select{width:100%;padding:.875rem 1rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--fg);font-size:1rem;transition:var(--transition)}
    .form-group input:focus,.form-group select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:.875rem 1.75rem;font-weight:600;border:none;border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);text-decoration:none}
    .btn-primary{background:linear-gradient(135deg,#10b981,#059669);color:#ffffff;width:100%}
    .btn-warning{background:linear-gradient(135deg,#f59e0b,#d97706);color:#0b1220;font-weight:600}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--accent-dim)}
    .btn-secondary{background:transparent;color:var(--fg);border:1px solid var(--border)}
    .btn-secondary:hover{background:var(--card);border-color:var(--accent)}
    .quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;width:100%}
    .quiz-subject{background:var(--accent-dim);color:var(--accent);padding:.375rem .875rem;border-radius:999px;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
    .quiz-paket{font-size:.95rem;color:var(--muted)}
    .question-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.75rem;margin-bottom:1.5rem;width:100%}
    .question-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
    .question-number{font-family:'JetBrains Mono',monospace;font-size:.8rem;font-weight:600;color:var(--accent);background:var(--accent-dim);padding:.25rem .75rem;border-radius:var(--radius-sm)}
    .question-type{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:.2rem .5rem;border-radius:4px;background:var(--bg);color:var(--muted);border:1px solid var(--border)}
    .question-text{font-size:1.1rem;margin-bottom:1.5rem}
    .wacana-block{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius-sm);padding:1.25rem;margin-bottom:1.5rem;font-size:.95rem;color:var(--muted)}
    .options{display:flex;flex-direction:column;gap:.75rem}
    .option{display:flex;align-items:center;gap:.875rem;padding:1rem 1.25rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);text-align:left;width:100%;color:var(--fg)}
    .option:hover{border-color:var(--accent);background:var(--accent-dim)}
    .option.selected{border-color:var(--accent);background:var(--accent-dim);box-shadow:0 0 0 2px var(--accent-dim)}
    .option input{accent-color:var(--accent);width:20px;height:20px;flex-shrink:0}
    .option-label{flex:1;font-size:1rem}
    .kategori-item{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.75rem 1rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:.5rem}
    .kategori-item span{flex:1;font-size:.95rem}
    .kategori-btns{display:flex;gap:.5rem}
    .kategori-btns button{padding:.375rem .75rem;font-size:.85rem;border-radius:4px;border:1px solid var(--border);background:var(--bg);color:var(--fg);cursor:pointer}
    .kategori-btns button.active{background:var(--accent);color:#0a1a14;border-color:var(--accent);font-weight:600}
    .nav-grid{display:flex;flex-wrap:wrap;gap:.375rem;margin-top:1rem}
    .nav-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:8px;background:#6b7280;color:#ffffff;font-size:.75rem;font-weight:600;cursor:pointer;transition:var(--transition);font-family:'JetBrains Mono',monospace}
    .nav-btn:hover{border-color:var(--accent);color:var(--accent)}
    .nav-btn.answered{background:#10b981;border-color:#10b981;color:#ffffff}
    .nav-btn.doubt{background:#f59e0b;border-color:#f59e0b;color:#0b1220}
    .nav-btn.current{border-color:#ffffff;box-shadow:0 0 0 2px rgba(255,255,255,0.3)}
    .nav-btn.answered.current{background:#059669;border-color:#ffffff;color:#ffffff}
    .nav-btn.doubt.current{background:#d97706;border-color:#ffffff;color:#0b1220}
    .quiz-footer{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;padding-top:1rem;border-top:1px solid var(--border);width:100%}
    .quiz-actions{display:flex;gap:1rem}
    .result-header{text-align:center;margin-bottom:1.5rem}
    .result-score{font-size:4rem;font-weight:800;font-family:'JetBrains Mono',monospace;background:linear-gradient(135deg,var(--accent),#b8952e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:.5rem}
    .stat{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:1rem;text-align:center;margin-bottom:.75rem}
    .stat-value{font-size:1.75rem;font-weight:700;font-family:'JetBrains Mono',monospace}
    .stat-label{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:.25rem}
    .stat.correct .stat-value{color:var(--success)}
    .stat.incorrect .stat-value{color:var(--danger)}
    .stat.unanswered .stat-value{color:var(--warning)}
    footer{padding:1.5rem;text-align:center;color:var(--muted);font-size:.8rem;border-top:1px solid var(--border)}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header>
  <a href="#" class="logo" onclick="return false;">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"></polygon><line x1="12" y1="22" x2="12" y2="15.5"></line><polyline points="22 8.5 12 15.5 2 8.5"></polyline></svg>
    SmartDrill 2026
  </a>
  <div style="display:flex;align-items:center;gap:1rem;">
    <button class="btn btn-primary" id="headerSubmitBtn" style="display:none;padding:.5rem 1rem;font-size:.875rem;background:var(--success);color:#fff;" onclick="finishQuiz()">Kumpulkan Jawaban</button>
    <div class="timer" id="timerDisplay" style="display:none">60:00</div>
  </div>
</header>
<main>
  <!-- Step 1: Login -->
  <section class="step active" id="step1">
    <div class="card" style="max-width:440px;margin:auto">
      <h1 style="font-size:2rem;font-weight:800;margin-bottom:1.5rem">Masuk SmartDrill</h1>
      <form id="loginForm">
        <div class="form-group">
          <label for="studentName">Nama Siswa</label>
          <input type="text" id="studentName" required autocomplete="name" placeholder="Nama lengkap siswa">
        </div>
        <div class="form-group">
          <label for="studentToken">Token Akses</label>
          <input type="text" id="studentToken" required autocomplete="off" placeholder="Masukkan token tryout">
        </div>
        <button type="button" class="btn btn-primary" style="margin-top:1rem" onclick="handleLogin()">Lanjut</button>
      </form>
    </div>
  </section>

  <!-- Step 2: Pilih Mapel & Paket -->
  <section class="step" id="step2">
    <div class="card" style="max-width:520px;margin:auto">
      <h1 style="font-size:2rem;font-weight:800;margin-bottom:1.5rem">Pilih Paket Ujian</h1>
      <p style="color:var(--muted);margin-bottom:1.5rem" id="welcomeText"></p>
      <form id="paketForm" onsubmit="startQuiz(event)">
        <div class="form-group">
          <label for="subjectSelect">Mata Pelajaran</label>
          <select id="subjectSelect" required onchange="updatePaketOptions()">
            <option value="">-- Pilih Mata Pelajaran --</option>
            <option value="Matematika">Matematika (Numerasi)</option>
            <option value="Bahasa Indonesia">Bahasa Indonesia (Literasi)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="paketSelect">Paket Soal</label>
          <select id="paketSelect" required disabled>
            <option value="">-- Pilih Mapel Dulu --</option>
          </select>
        </div>
        <div style="display:flex;gap:1rem;margin-top:1.5rem">
          <button type="button" class="btn btn-secondary" style="flex:1" onclick="goStep(1)">Kembali</button>
          <button type="submit" class="btn btn-primary" style="flex:1">Mulai Kerjakan Soal</button>
        </div>
      </form>
    </div>
  </section>

  <!-- Step 3: Quiz -->
  <section class="step" id="step3">
    <div class="quiz-header">
      <div>
        <span class="quiz-subject" id="quizSubject"></span>
        <span class="quiz-paket" id="quizPaket"></span>
      </div>
      <div class="quiz-progress"><span id="progressText" style="font-family:'JetBrains Mono',monospace;font-weight:600"></span></div>
    </div>
    <div class="question-card" id="questionCard"></div>
    <div class="quiz-footer">
      <div class="nav-grid" id="navGrid"></div>
      <div class="quiz-actions">
        <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">← Sebelumnya</button>
        <button class="btn btn-warning" id="doubtBtn" style="width:auto;padding:.875rem 1.75rem;margin-right:.75rem" title="Tandai Ragu-ragu" onclick="toggleDoubt()">🚩 Ragu-ragu</button>
        <br>
        <button class="btn btn-primary" id="submitAllBtn" style="width:auto;padding:.875rem 1.75rem;margin-left:.5rem;" onclick="finishQuiz()">Kumpulkan Semua Jawaban</button>
        <button class="btn btn-primary" id="lanjutBtn" style="width:auto;padding:.875rem 1.75rem;margin-left:.5rem;" onclick="nextQuestion()">Lanjutkan</button>
        <button class="btn btn-primary" id="finishBtn" style="width:auto;padding:.875rem 1.75rem;margin-left:.5rem;display:none;" onclick="finishQuiz()">Kumpulkan Jawaban</button>
      </div>
    </div>
  </section>

  <!-- Step 4: Result -->
  <section class="step" id="step4">
      <div class="card" style="max-width:520px;margin:auto;text-align:center">
        <h1 class="result-header" style="font-size:2rem;font-weight:800;margin-bottom:.5rem">Hasil Ujian</h1>
        <p style="color:var(--muted);margin-bottom:1.5rem" id="resultStudentInfo"></p>
        <div class="result-score" id="resultScore">0/30</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:2rem">
          <div class="stat correct"><div class="stat-value" id="statCorrect">0</div><div class="stat-label">Benar</div></div>
          <div class="stat incorrect"><div class="stat-value" id="statIncorrect">0</div><div class="stat-label">Salah</div></div>
          <div class="stat unanswered"><div class="stat-value" id="statUnanswered">0</div><div class="stat-label">Kosong</div></div>
        </div>
        <button class="btn btn-secondary" id="showKeyBtn" onclick="toggleKey()" style="margin-top:1rem;width:auto;padding:.75rem 1.5rem;">Lihat Kunci & Pembahasan</button>
        <div id="answerKey" style="display:none;margin-top:2rem;text-align:left;max-height:500px;overflow:auto;"></div>
        <button class="btn btn-primary" onclick="goStep(1)" style="margin-top:1.5rem;width:auto;padding:.875rem 1.75rem;">Keluar / Uji Lagi</button>
      </div>
    </section>
</main>
<footer>© 2026 SmartDrill. Platform Tryout TKA Sekolah Dasar.</footer>

 dan 20", "kunci": "A,C,D", "pembahasan": "Langkah 1: Faktorisasi prima:\n- 12 = 2² × 3\n- 15 = 3 × 5\n- 10 = 2 × 5\n- 30 = 2 × 3 × 5\n- 20 = 2² × 5\nLangkah 2: KPK dicari dari perkalian faktor prima dengan pangkat terbesar: 2² × 3 × 5 = 4 × 3 × 5 = 60.\nPasangan yang KPK-nya 60 adalah 12 & 15, 20 & 30, serta 15 & 20.", "status_cek": "OK", "catatan": "DIPERBAIKI: kunci .docx hanya \"A\", padahal jawaban benar A, C, D.", "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 1", "mapel": "Matematika", "no": 4, "tipe": "PG", "materi": "Bilangan", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "FPB dan KPK dari bilangan 48 dan 72 berturut-turut adalah...", "opsi_A": "24 dan 144", "opsi_B": "12 dan 96", "opsi_C": "24 dan 96", "opsi_D": "12 dan 144", "kunci": "A", "pembahasan": "Langkah 1: Faktorisasi prima 48 = 2⁴ × 3 dan 72 = 2³ × 3².\nLangkah 2: FPB = perkalian faktor prima sekutu dengan pangkat terkecil = 2³ × 3 = 8 × 3 = 24.\nLangkah 3: KPK = perkalian semua faktor prima dengan pangkat terbesar = 2⁴ × 3² = 16 × 9 = 144.", "status_cek": "OK", "catatan": "DIPERBAIKI: jawaban benar (24 dan 144) tidak ada di opsi .docx; opsi A \"149 satuan\" diganti. Kunci .docx = D (\"12 dan 144\") tidak sesuai hasil hitung.", "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 1", "mapel": "Matematika", "no": 5, "tipe": "PG", "materi": "Bilangan", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Ibu membeli 3 1/2 kg tepung terigu. Digunakan untuk membuat kue 1 3/4 kg, kemudian ibu membeli lagi 0,5 kg. Total tepung terigu ibu sekarang adalah...", "opsi_A": "1 3/4 kg", "opsi_B": "2 3/4 kg", "opsi_C": "2 1/4 kg", "opsi_D": "2 1/2 kg", "kunci": "C", "pembahasan": "Langkah 1: Ubah pecahan campuran ke pecahan biasa atau desimal: 3 1/2 = 3,5; 1 3/4 = 1,75; 0,5 = 0,5.\nLangkah 2: Hitung total: 3,5 - 1,75 + 0,5 = 1,75 + 0,5 = 2,25 kg atau 2 1/4 kg.", "status_cek": "OK", "catatan": "DIPERBAIKI: jawaban benar (2 1/4 kg) tidak ada di opsi .docx; opsi C \"127 kg\" diganti. Kunci .docx = D (\"2 1/2 kg\") tidak sesuai hasil hitung.", "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 1", "mapel": "Matematika", "no": 6, "tipe": "Kategori", "materi": "Bilangan", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Tentukan Benar (B) atau Salah (S) untuk operasi hitung pecahan berikut:", "opsi_A": "2/3 + 1/4 = 11/12", "opsi_B": "3/5 × 5/6 = 1/2", "opsi_C": "1 1/2 : 0,5 = 2", "opsi_D": null, "kunci": "B,B,S", "pembahasan": "Analisis Kategori:\n1. 2/3 + 1/4 = 8/12 + 3/12 = 11/12 (BENAR).\n2. 3/5 × 5/6 = 3/6 = 1/2 (BENAR).\n3. 1 1/2 : 0,5 = 1,5 : 0,5 = 3, bukan 2 (SALAH).", "status_cek": "OK", "catatan": "DIPERBAIKI: pernyataan dan kunci diambil dari pembahasan .docx (kunci .docx \"A\" tidak valid).", "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 1", "mapel": "Matematika", "no": 7, "tipe": "PG", "materi": "Bilangan", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Hasil dari operasi hitung (-24) + 72 : (-8) - (-15) adalah...", "opsi_A": "-18", "opsi_B": "-48", "opsi_C": "-33", "opsi_D": "6", "kunci": "A", "pembahasan": "Langkah 1: Pembagian dikerjakan dahulu: 72 : (-8) = -9.\nLangkah 2: Penjumlahan & pengurangan dari kiri: (-24) + (-9) = -33.\nLangkah 3: -33 - (-15) = -33 + 15 = -18.", "status_cek": "OK", "catatan": "DIPERBAIKI: jawaban benar (-18) tidak ada di opsi .docx; opsi A \"173 satuan\" diganti. Kunci .docx = C (\"-33\") tidak sesuai hasil hitung.", "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 1", "mapel": "Matematika", "no": 8, "tipe": "PG", "materi": "Bilangan", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Sebuah bus memuat 45 penumpang. Di halte A turun 12 penumpang dan naik 8 penumpang. Di halte B turun 15 penumpang dan naik 20 penumpang. Jumlah penumpang bus sekarang adalah...", "opsi_A": "44 penumpang", "opsi_B": "46 penumpang", "opsi_C": "48 penumpang", "opsi_D": "42 penumpang", "kunci": "B", "pembahasan": mbar": null, "pertanyaan": "Tentang data statistik, tentukan Benar (B) atau Salah (S):", "opsi_A": "Mean selalu merupakan nilai yang paling sering muncul dalam data", "opsi_B": "Median dapat dihitung dengan mengurutkan data dan mengambil nilai tengah", "opsi_C": "Modus dapat memiliki lebih dari satu nilai", "opsi_D": null, "kunci": "S,B,B", "pembahasan": "A salah – mean adalah rata‑rata, bukan nilai yang paling sering. B benar – median memang nilai tengah setelah data diurutkan. C benar – modus dapat multimodal.", "status_cek": "OK", "catatan": "DIPERBAIKI: soal meminta Benar/Salah per pernyataan, jadi tipe diubah dari MCMA ke Kategori; kunci S,B,B diambil dari pembahasan .docx (kunci .docx \"B, C\" hanya menandai pernyataan yang benar).", "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 1", "mapel": "Matematika", "no": 28, "tipe": "PG", "materi": "Data & Statistika", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Selisih nilai tertinggi dan terendah dari data: 45, 60, 75, 50, 90, 85, 65 adalah...", "opsi_A": "50", "opsi_B": "35", "opsi_C": "45", "opsi_D": "40", "kunci": "C", "pembahasan": "Nilai tertinggi 90 dan terendah 45. Selisih = 90 - 45 = 45.", "status_cek": "OK", "catatan": "DIPERBAIKI: jawaban benar (45) tidak ada di opsi .docx; opsi C \"175 satuan\" diganti. Kunci .docx = D (\"40\") tidak sesuai hasil hitung. Pembahasan di .docx tidak sesuai soal, ditulis ulang.", "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 1", "mapel": "Matematika", "no": 29, "tipe": "PG", "materi": "Data & Statistika", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Penjualan buku 5 hari: Senin 20, Selasa 35, Rabu 25, Kamis 40, Jumat 30. Rata-rata penjualan per hari adalah...", "opsi_A": "32 buku", "opsi_B": "28 buku", "opsi_C": "30 buku", "opsi_D": "35 buku", "kunci": "C", "pembahasan": "Total penjualan = 20 + 35 + 25 + 40 + 30 = 150. Rata-rata = 150 : 5 = 30 buku.", "status_cek": "OK", "catatan": "DIPERBAIKI: jawaban b  "OK", "catatan": null, "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 2", "mapel": "Matematika", "no": 3, "tipe": "MCMA", "materi": "Bilangan", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Manakah pernyataan bilangan berikut yang bernilai benar? (Pilih >1)", "opsi_A": "-12 > -15", "opsi_B": "0,625 = 5/8", "opsi_C": "-7 + (-8) = 15", "opsi_D": "25% dari 400 adalah 100", "kunci": "A,B,D", "pembahasan": "1. -12 > -15 (benar).\n2. 0,625 = 5/8 (benar).\n3. -7 + (-8) = -15 (salah).\n4. 25% dari 400 = 100 (benar).\nPernyataan benar: A, B, dan D.", "status_cek": "OK", "catatan": null, "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 2", "mapel": "Matematika", "no": 4, "tipe": "PG", "materi": "Bilangan", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Lampu A menyala setiap 6 menit, lampu B setiap 8 menit, lampu C setiap 12 menit. Ketiga lampu menyala bersamaan pukul 08.00. Kapan mereka menyala bersamaan kembali?", "opsi_A": "08.12", "opsi_B": "08.24", "opsi_C": "08.36", "opsi_D": "08.48", "kunci": "B", "pembahasan": "Langkah 1: KPK dari 6, 8, dan 12 adalah 24 menit.\nLangkah 2: 08.00 + 24 menit = 08.24.\nJawaban: 08.24 (Opsi B).", "status_cek": "OK", "catatan": null, "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 2", "mapel": "Matematika", "no": 5, "tipe": "PG", "materi": "Bilangan", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Hasil dari 75% : 0,25 × 1 2/5 adalah...", "opsi_A": "2 4/5", "opsi_B": "4 1/5", "opsi_C": "3 1/2", "opsi_D": "3 4/5", "kunci": "B", "pembahasan": "Langkah 1: 75% = 0,75; 0,25 = 0,25; 1 2/5 = 1,4.\nLangkah 2: 0,75 ÷ 0,25 = 3.\nLangkah 3: 3 × 1,4 = 4,2 = 4 1/5.\nJawaban: 4 1/5 (Opsi B).", "status_cek": "OK", "catatan": null, "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 2", "mapel": "Matematika", "no": 6, "tipe": "PG", "materi": "Bilangan", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Sebuah toko menjual 3,5 kg ap \nJawaban: Opsi A.", "status_cek": "OK", "catatan": null, "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 2", "mapel": "Matematika", "no": 14, "tipe": "PG", "materi": "Geometri & Pengukuran", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Roda sepeda jari-jari 35 cm berputar 20 kali. Jarak tempuh (π=22/7)...", "opsi_A": "4.400 cm", "opsi_B": "4.200 cm", "opsi_C": "4.600 cm", "opsi_D": "4.000 cm", "kunci": "A", "pembahasan": "Langkah 1: Keliling = 2 × (22/7) × 35 = 220 cm.\nLangkah 2: Jarak = 220 × 20 = 4.400 cm.\nJawaban: Opsi A.", "status_cek": "OK", "catatan": null, "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 2", "mapel": "Matematika", "no": 15, "tipe": "PG", "materi": "Geometri & Pengukuran", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Volume silinder jari-jari 5 cm tinggi 10 cm (π=3,14)...", "opsi_A": "785 cm³", "opsi_B": "250 cm³", "opsi_C": "500 cm³", "opsi_D": "1.000 cm³", "kunci": "A", "pembahasan": "Langkah 1: Volume = π × r² × t = 3,14 × 5² × 10 = 785 cm³.\nJawaban: Opsi A.", "status_cek": "OK", "catatan": null, "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 2", "mapel": "Matematika", "no": 16, "tipe": "PG", "materi": "Geometri & Pengukuran", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Kerucut jari-jari 7 cm garis pelukis 25 cm (π=22/7). Luas selimut?", "opsi_A": "550 cm²", "opsi_B": "500 cm²", "opsi_C": "600 cm²", "opsi_D": "450 cm²", "kunci": "A", "pembahasan": "Langkah 1: Luas selimut = π × r × s = (22/7) × 7 × 25 = 550 cm².\nJawaban: Opsi A.", "status_cek": "OK", "catatan": null, "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 2", "mapel": "Matematika", "no": 17, "tipe": "PG", "materi": "Geometri & Pengukuran", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Volume bola jari-jari 21 cm (π=22/7)...", "opsi_A": "38.808 cm³", "opsi_B": "19.404 cm³", "opsi_C": "9.702 cm³", "opsi_D": "77.616 cm³", "kunci": "A", "pembahasan": "Langkah 1: Volume = 4/3 × π × r³ = 4/3 × (22/7) × 21³ = 38.808 cm³.\nJawaban: Opsi A.", "status_cek": "OK", "catatan": null, "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 2", "mapel": "Matematika", "no": 18, "tipe": "PG", "materi": "Geometri & Pengukuran", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Luas permukaan bola jari-jari 7 cm?", "opsi_A": "616 cm²", "opsi_B": "154 cm²", "opsi_C": "308 cm²", "opsi_D": "462 cm²", "kunci": "A", "pembahasan": "Langkah 1: Luas = 4 × π × r² = 4 × (22/7) × 7² = 616 cm².\nJawaban: Opsi A.", "status_cek": "OK", "catatan": null, "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 2", "mapel": "Matematika", "no": 19, "tipe": "PG", "materi": "Geometri & Pengukuran", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Pesawat menempuh 2.400 km dalam 3 jam 20 menit. Kecepatan rata-rata?", "opsi_A": "720 km/jam", "opsi_B": "700 km/jam", "opsi_C": "750 km/jam", "opsi_D": "680 km/jam", "kunci": "A", "pembahasan": "Langkah 1: Waktu = 3 1/3 jam = 10/3 jam.\nLangkah 2: Kecepatan = 2.400 ÷ (10/3) = 720 km/jam.\nJawaban: Opsi A.", "status_cek": "OK", "catatan": null, "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 2", "mapel": "Matematika", "no": 20, "tipe": "PG", "materi": "Geometri & Pengukuran", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Kolam 180 m³ diisi debit 25 L/detik. Waktu mengisi?", "opsi_A": "2 jam", "opsi_B": "2,5 jam", "opsi_C": "3 jam", "opsi_D": "1,5 jam", "kunci": "A", "pembahasan": "Langkah 1: 180 m³ = 180.000 liter.\nLangkah 2: Waktu = 180.000 ÷ 25 = 7.200 detik = 2 jam.\nJawaban: Opsi A.", "status_cek": "OK", "catatan": null, "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 2", "mapel": "Matematika", "no": 21, "tipe": "PG", "materi": "Data & Statistika", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Data nilai: 78, 85, 92, 76, 88. Rata-rata (mean)...", "opsi_A": "84", "opsi_B": "82", "opsi_C": "86", "opsi_D": "80", "kunci": "A", "pembahasan": "Langkah 1: Jumlah = 419. Mean = 419 ÷ 5 = 83,8 ≈ 84.\nJawaban: Opsi A.", "status_cek": "OK", "catatan": "CEK: rata-rata sebenarnya 83,8; opsi 84 hanya benar jika dibulatkan. Pertimbangkan menambah \"(dibulatkan ke bilangan bulat)\" di soal.", "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 2", "mapel": "Matematika", "no": 22, "tipe": "PG", "materi": "Data & Statistika", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Rata-rata 18 siswa = 80. Tambah 2 siswa susulan, rata-rata 20 siswa = 79. Rata-rata susulan?", "opsi_A": "72", "opsi_B": "70", "opsi_C": "68", "opsi_D": "74", "kunci": "B", "pembahasan": "Langkah 1: Total 18 = 1.440; Total 20 = 1.580.\nLangkah 2: Total 2 siswa = 1.580 - 1.440 = 140.\nLangkah 3: Rata-rata = 140 ÷ 2 = 70.\nJawaban: Opsi B.", "status_cek": "OK", "catatan": null, "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 2", "mapel": "Matematika", "no": 23, "tipe": "PG", "materi": "Data & Statistika", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Data: 70, 75, 80, 85, 70, 90, 75, 70, 95, 85. Modus?", "opsi_A": "70", "opsi_B": "75", "opsi_C": "80", "opsi_D": "85", "kunci": "A", "pembahasan": "Langkah 1: Angka yang paling sering muncul adalah 70 (3 kali).\nJawaban: Opsi A.", "status_cek": "OK", "catatan": null, "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 2", "mapel": "Matematika", "no": 24, "tipe": "PG", "materi": "Data & Statistika", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "30% dari 40 siswa mendapat nilai A. Berapa siswa?", "opsi_A": "12", "opsi_B": "10", "opsi_C": "14", "opsi_D": "8", "kunci": "A", "pembahasan": "Langkah 1: 0,3 × 40 = 12 siswa.\nJawaban: Opsi A.", "status_cek": "OK", "catatan": null, "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 2", "mapel": "Matematika", "no": 25, "tipe": "PG", "materi": "Data & Statistika", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Tinggi 9 anak: 135, 140, 138, 142, 145, 139, 141, 144, 137. Median?", "opsi_A": "138", "opsi_B": "139", "opsi_C": "140", "opsi_D": "141", "kunci": "C", "pembahasan": "Langkah 1: Urutkan data: 135, 137, 138, 139, 140, 141, 142, 144, 145.\nLangkah 2: Nilai tengah (data ke-5) adalah 140.\nJawaban: Opsi C.", "status_cek": "OK", "catatan": null, "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 2", "mapel": "Matematika", "no": 26, "tipe": "PG", "materi": "Data & Statistika", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Diagram lingkaran 500 siswa: Musik 30%, Olahraga 35%, Seni 25%, sisanya Membaca. Jumlah siswa Membaca?", "opsi_A": "50", "opsi_B": "40", "opsi_C": "60", "opsi_D": "30", "kunci": "A", "pembahasan": "Langkah 1: Persen Membaca = 100% - (30%+35%+25%) = 10%.\nLangkah 2: 10% × 500 = 50 siswa.\nJawaban: Opsi A.", "status_cek": "OK", "catatan": null, "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 2", "mapel": "Matematika", "no": 27, "tipe": "PG", "materi": "Data & Statistika", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Tentukan Benar (B) atau Salah (S):\n1. Mean selalu salah satu nilai data\n2. Median data genap = rata-rata 2 data tengah\n3. Modus bisa lebih dari satu", "opsi_A": "1B,2B,3B", "opsi_B": "1S,2B,3B", "opsi_C": "1S,2S,3B", "opsi_D": "1B,2S,3S", "kunci": "B", "pembahasan": "Langkah 1: Pernyataan 1 salah (mean pecahan). Pernyataan 2 benar. Pernyataan 3 benar (multimodal).\nJawaban: 1S, 2B, 3B (Opsi B).", "status_cek": "OK", "catatan": "Tipe di .docx tertulis MCMA, tetapi opsi dan kunci berbentuk pilihan ganda tunggal; diubah menjadi PG.", "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 2", "mapel": "Matematika", "no": 28, "tipe": "PG", "materi": "Data & Statistika", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Jangkauan data berat: 42, 50, 38, 65, 48, 55, 60.", "opsi_A": "27", "opsi_B": "25", "opsi_C": "23", "opsi_D": "29", "kunci": "A", "pembahasan": "Langkah 1: Maksimum = 65, Minimum = 38.\nLangkah 2: Jangkauan = 65 - 38 = 27.\nJawaban: Opsi A.", "status_cek": "OK", "catatan": null, "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 2", "mapel": "Matematika", "no": 29, "tipe": "PG", "materi": "Data & Statistika", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Rata-rata 4 anak = 45 kg. Masuk 1 anak, rata-rata 5 anak = 46 kg. Berat anak baru?", "opsi_A": "50 kg", "opsi_B": "48 kg", "opsi_C": "46 kg", "opsi_D": "52 kg", "kunci": "A", "pembahasan": "Langkah 1: Total 4 anak = 4 × 45 = 180 kg.\nLangkah 2: Total 5 anak = 5 × 46 = 230 kg.\nLangkah 3: Berat anak baru = 230 - 180 = 50 kg.\nJawaban: Opsi A.", "status_cek": "OK", "catatan": null, "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 2", "mapel": "Matematika", "no": 30, "tipe": "PG", "materi": "Data & Statistika", "id_wacana": null, "bacaan": null, "gambar": null, "pertanyaan": "Frekuensi: 5, 8, 12, 7, 8. Rata-rata frekuensi tiap kelompok?", "opsi_A": "7", "opsi_B": "8", "opsi_C": "9", "opsi_D": "6", "kunci": "B", "pembahasan": "Langkah 1: Jumlah frekuensi = 5 + 8 + 12 + 7 + 8 = 40.\nLangkah 2: Rata-rata = 40 ÷ 5 = 8.\nJawaban: Opsi B.", "status_cek": "OK", "catatan": "Tipe di .docx tertulis Kategori, tetapi opsi dan kunci berbentuk pilihan ganda tunggal; diubah menjadi PG.", "wacana_judul": null, "wacana_teks": null}, {"paket": "Tryout 1", "mapel": "Bahasa Indonesia", "no": 1, "tipe": "PG", "materi": null, "id_wacana": "BIN-T1-1", "bacaan": "Sampah plastik menjadi salah satu masalah lingkungan terbesar di Indonesia karena sulit terurai secara alami. Setiap tahun masyarakat Indonesia menghasilkan puluhan juta ton sampah plastik yang sebagian besar berakhir di TPA atau laut. Daur ulang plastik merupakan upaya mengelola sampah dengan mengubah plastik bekas menjadi produk baru yang bernilai. Proses daur ulang meliputi pengumpulan, penyortiran, pencucian, pemotongan, dan peleburan menjadi butiran plastik. Butiran plastik hasil daur ulang dapat dibuat menjadi botol baru, tas, pakaian, hingga bahan bangunan. Selain mengurangi sampah, daur ulang plastik juga menghemat energi hingga 80% dibanding memproduksi plastik baru dari minyak bumi. Partisipasi masyarakat memisahkan sampah organik dan anorganik sejak rumah tangga sangat menentukan keberhasilan daur ulang.", "gambar": null, "pertanyaan": "Apa masalah utama sampah plastik menurut wacana?", "opsi_A": "Harga mahal", "opsi_B": "Sulit terurai secara alami", "opsi_C": "Tidak bernilai ekonomis", "opsi_D": "Sulit didaur ulang", "kunci": "B", "pembahasan": "Kalimat pertama wacana menyatakan \"Sampah plastik menjadi salah satu masalah lingkungan terbesar di Indonesia karena sulit terurai secara alami.\"", "status_cek": "OK", "catatan": null, "wacana_judul": "Daur Ulang Sampah Plastik", "wacana_teks": "Sampah plastik menjadi salah satu masalah lingkungan terbesar di Indonesia karena sulit terurai secara alami. Setiap tahun masyarakat Indonesia menghasilkan puluhan juta ton sampah plastik yang sebagian besar berakhir di TPA atau laut. Daur ulang plastik merupakan upaya mengelola sampah dengan mengubah plastik bekas menjadi produk baru yang bernilai. Proses daur ulang meliputi pengumpulan, penyortiran, pencucian, pemotongan, dan peleburan menjadi butiran plastik. Butiran plastik hasil daur ulang dapat dibuat menjadi botol baru, tas, pakaian, hingga bahan bangunan. Selain mengurangi sampah, daur ulang plastik juga menghemat energi hingga 80% dibanding memproduksi plastik baru dari minyak bumi. Partisipasi masyarakat memisahkan sampah organik dan anorganik sejak rumah tangga sangat menentukan keberhasilan daur ulang."}, {"paket": "Tryout 1", "mapel": "Bahasa Indonesia", "no": 2, "tipe": "MCMA", "materi": null, "id_wacana": "BIN-T1-1", "bacaan": "Sampah plastik menjadi salah satu masalah lingkungan terbesar di Indonesia karena sulit terurai secara alami. Setiap tahun masyarakat Indonesia menghasilkan puluhan juta ton sampah plastik yang sebagian besar berakhir di TPA atau laut. Daur ulang plastik merupakan upaya mengelola sampah dengan mengubah plastik bekas menjadi produk baru yang bernilai. Proses daur ulang meliputi pengumpulan, penyortiran, pencucian, pemotongan, dan peleburan menjadi butiran plastik. Butiran plastik hasil daur ulang dapat dibuat menjadi botol baru, tas, pakaian, hingga bahan bangunan. Selain mengurangi sampah, daur ulang plastik juga menghemat energi hingga 80% dibanding memproduksi plastik baru dari minyak bumi. Partisipasi masyarakat memisahkan sampah organik dan anorganik sejak rumah tangga sangat menentukan keberhasilan daur ulang.", "gambar": null, "pertanyaan": "Manakah yang termasuk proses daur ulang plastik? (Pilih >1)", "opsi_A": "Pengumpulan", "opsi_B": "Penyortiran", "opsi_C": "Pembakaran", "opsi_D": "Pencucian", "kunci": "A,B,D", "pembahasan": "Kalimat ke-4 menyebut \"Proses daur ulang meliputi pengumpulan, penyortiran, pencucian, pemotongan, dan peleburan.\" Pembakaran bukan proses daur ulang.", "status_cek": "OK", "catatan": null, "wacana_judul": "Daur Ulang Sampah Plastik", "wacana_teks": "Sampah plastik menjadi salah satu masalah lingkungan terbesar di Indonesia karena sulit terurai secara alami. Setiap tahun masyarakat Indonesia menghasilkan puluhan juta ton sampah plastik yang sebagian besar berakhir di TPA atau laut. Daur ulang plastik merupakan upaya mengelola sampah dengan mengubah plastik bekas menjadi produk baru yang bernilai. Proses daur ulang meliputi pengumpulan, penyortiran, pencucian, pemotongan, dan peleburan menjadi butiran plastik. Butiran plastik hasil daur ulang dapat dibuat menjadi botol baru, tas, pakaian, hingga bahan bangunan. Selain mengurangi sampah, daur ulang plastik juga menghemat energi hingga 80% dibanding memproduksi plastik baru dari minyak bumi. Partisipasi masyarakat memisahkan sampah organik dan anorganik sejak rumah tangga sangat menentukan keberhasilan daur ulang."}, {"paket": "Tryout 1", "mapel": "Bahasa Indonesia", "no": 3, "tipe": "Kategori", "materi": null, "id_wacana": "BIN-T1-1", "bacaan": "Sampah plastik menjadi salah satu masalah lingkungan terbesar di Indonesia karena sulit terurai secara alami. Setiap tahun masyarakat Indonesia menghasilkan puluhan juta ton sampah plastik yang sebagian besar berakhir di TPA atau laut. Daur ulang plastik merupakan upaya mengelola sampah dengan mengubah plastik bekas menjadi produk baru yang bernilai. Proses daur ulang meliputi pengumpulan, penyortiran, pencucian, pemotongan, dan peleburan menjadi butiran plastik. Butiran plastik hasil daur ulang dapat dibuat menjadi botol baru, tas, pakaian, hingga bahan bangunan. Selain mengurangi sampah, daur ulang plastik juga menghemat energi hingga 80% dibanding memproduksi plastik baru dari minyak bumi. Partisipasi masyarakat memisahkan sampah organik dan anorganik sejak rumah tangga sangat menentukan keberhasilan daur ulang.", "gambar": null, "pertanyaan": "Tentukan Benar (B) atau Salah (S):", "opsi_A": "Daur ulang plastik menghemat energi hingga 80% dibanding produksi baru.", "opsi_B": "Semua sampah plastik di Indonesia sudah terdaur ulang 100%.", "opsi_C": "Memisahkan sampah organik dan anorganik di rumah menunjang daur ulang.", "opsi_D": null, "kunci": "B,S,B", "pembahasan": "(1) Sesuai kalimat ke-6. (2) Wacana menyebut \"hanya sekitar 10-15% sampah yang berhasil terdaur ulang.\" (3) Sesuai kalimat terakhir.", "status_cek": "OK", "catatan": null, "wacana_judul": "Daur Ulang Sampah Plastik", "wacana_teks": "Sampah plastik menjadi salah satu masalah lingkungan terbesar di Indonesia karena sulit terurai secara alami. Setiap tahun masyarakat Indonesia menghasilkan puluhan juta ton sampah plastik yang sebagian besar berakhir di TPA atau laut. Daur ulang plastik merupakan upaya mengelola sampah dengan mengubah plastik bekas menjadi produk baru yang bernilai. Proses daur ulang meliputi pengumpulan, penyortiran, pencucian, pemotongan, dan peleburan menjadi butiran plastik. Butiran plastik hasil daur ulang dapat dibuat menjadi botol baru, tas, pakaian, hingga bahan bangunan. Selain mengurangi sampah, daur ulang plastik juga menghemat energi hingga 80% dibanding memproduksi plastik baru dari minyak bumi. Partisipasi masyarakat memisahkan sampah organik dan anorganik sejak rumah tangga sangat menentukan keberhasilan daur ulang."}, {"paket": "Tryout 1", "mapel": "Bahasa Indonesia", "no": 4, "tipe": "PG", "materi": null, "id_wacana": "BIN-T1-2", "bacaan": "Sampah organik seperti sisa sayur, kulit buah, dan daun kering dapat diolah menjadi kompos melalui proses pengkomposan. Pengkomposan adalah pengolahan sampah organik secara biologis dengan bantuan mikroorganisme pengurai. Hasil kompos berupa pupuk alami yang kaya nutrisi dan ramah lingkungan untuk tanaman. Proses ini mengurangi volume sampah yang masuk ke TPA serta mengurangi emisi gas metana berbahaya. Masyarakat dapat membuat kompos sederhana di halaman rumah dengan ember atau biopori. Program Green Bin di beberapa kota besar membuktikan pengkomposan skala komunitas mampu mengurangi sampah signifikan.", "gambar": null, "pertanyaan": "Apa hasil akhir dari proses pengkomposan?", "opsi_A": "Bahan bakar", "opsi_B": "Energi listrik", "opsi_C": "Gas metana", "opsi_D": "Pupuk alami (kompos)", "kunci": "D", "pembahasan": "Kalimat ke-3: \"Hasil kompos berupa pupuk alami yang kaya nutrisi...\"", "status_cek": "OK", "catatan": null, "wacana_judul": "Kompos dari Sampah Organik", "wacana_teks": "Sampah organik seperti sisa sayur, kulit buah, dan daun kering dapat diolah menjadi kompos melalui proses pengkomposan. Pengkomposan adalah pengolahan sampah organik secara biologis dengan bantuan mikroorganisme pengurai. Hasil kompos berupa pupuk alami yang kaya nutrisi dan ramah lingkungan untuk tanaman. Proses ini mengurangi volume sampah yang masuk ke TPA serta mengurangi emisi gas metana berbahaya. Masyarakat dapat membuat kompos sederhana di halaman rumah dengan ember atau biopori. Program Green Bin di beberapa kota besar memb "}, {"paket": "Tryout 1", "mapel": "Bahasa Indonesia", "no": 11, "tipe": "Kategori", "materi": null, "id_wacana": "BIN-T1-3", "bacaan": "Bank sampah adalah sistem pengelolaan sampah berbasis komunitas yang mengolah sampah anorganik bernilai ekonomis. Nasabah bank sampah menyetor sampah terpisah seperti plastik, kertas, logam, dan kaca untuk ditukar dengan tabungan uang. Pengelola bank sampah menjual sampah terkumpul ke pabrik daur ulang atau industri pengolahan. Sistem ini mendorong perilaku memisahkan sampah sejak sumber dan meningkatkan kesadaran lingkungan. Di Indonesia, jumlah bank sampah terus bertambah didukung kebijakan pemerintah melalui Permen LHK No. 14 Tahun 2021. Bank sampah juga memberdayakan ekonomi masyarakat dengan menciptakan lapangan kerja pengumpul dan pengolah. Kemitraan dengan sekolah dan pasar tradisional memperluas jangkauan edukasi 3R (Reduce, Reuse, Recycle).", "gambar": null, "pertanyaan": "Benar/Salah:", "opsi_A": "Bank sampah hanya menerima sampah plastik.", "opsi_B": "Kemitraan dengan sekolah memperluas edukasi 3R.", "opsi_C": "Sampah disetor dalam kondisi tercampur (tidak dipisah).", "opsi_D": null, "kunci": "S,B,S", "pembahasan": "(1) Kalimat ke-2 menyebut plastik, kertas, logam, kaca. (2) Kalimat terakhir. (3) Kalimat ke-2 \"sampah terpisah.\"", "status_cek": "OK", "catatan": null, "wacana_judul": "Bank Sampah Berbasis Komunitas", "wacana_teks": "Bank sampah adalah sistem pengelolaan sampah berbasis komunitas yang mengolah sampah anorganik bernilai ekonomis. Nasabah bank sampah menyetor sampah terpisah seperti plastik, kertas, logam, dan kaca untuk ditukar dengan tabungan uang. Pengelola bank sampah menjual sampah terkumpul ke pabrik daur ulang atau industri pengolahan. Sistem ini mendorong perilaku memisahkan sampah sejak sumber dan meningkatkan kesadaran lingkungan. Di Indonesia, jumlah bank sampah terus bertambah didukung kebijakan pemerintah melalui Permen LHK No. 14 Tahun 2021. Bank sampah juga memberdayakan ekonomi masyarakat dengan menciptakan lapangan kerja pengumpul dan pengolah. Kemitraan dengan sekolah dan pasar tradisional memperluas jangkauan edukasi 3R (Reduce, Reuse, Recycle)."}, {"paket": "Tryout 1", "mapel": "Bahasa Indonesia", "no": 12, "tipe": "PG", "materi": null, "id_wacana": "BIN-T1-4", "bacaan": "Konsep 5R adalah pengembangan dari 3R yang lebih komprehensif dalam pengelolaan sampah berkelanjutan. Reduce berarti mengurangi pembuatan sampah sejak sumber dengan konsumsi bijak dan hindari barang sekali pakai. Reuse adalah menggunakan kembali barang yang masih layak pakai tanpa mengubah bentuknya. Recycle melibatkan proses daur ulang sampah menjadi bahan baku atau produk baru. Replace mendorong penggantian barang sekali pakai dengan alternatif tahan lama seperti tas kain. Repair berarti memperbaiki barang rusak agar tetap berfungsi dan tidak terbuang prematurely. Penerapan 5R sehari-hari secara kolektif berdampak besar pada pengurangan jejak karbon dan volume sampah nasional.", "gambar": null, "pertanyaan": "Manakah yang termasuk tindakan Reduce?", "opsi_A": "Mencetak kertas dua sisi", "opsi_B": "Membuat kerajinan dari botol bekas", "opsi_C": "Memperbaiki sepeda rusak", "opsi_D": "Menggunakan tas kain belanja", "kunci": "A", "pembahasan": "Kalimat ke-3: \"Reduce berarti mengurangi pembuatan sampah sejak sumber dengan konsumsi bijak… kurangi penggunaan kertas di kantor dengan melakukan print preview sebelum mencetak.\"", "status_cek": "OK", "catatan": null, "wacana_judul": "Gerakan 5R (Reduce, Reuse, Recycle, Replace, Repair)", "wacana_teks": "Konsep 5R adalah pengembangan dari 3R yang lebih komprehensif dalam pengelolaan sampah berkelanjutan. Reduce berarti mengurangi pembuatan sampah sejak sumber dengan konsumsi bijak dan hindari barang sekali pakai. Reuse adalah menggunakan kembali barang yang masih layak pakai tanpa mengubah bentuknya. Recycle melibatkan proses daur ulang sampah menjadi bahan baku atau produk baru. Replace mendorong penggantian barang sekali pakai dengan alternatif tahan lama seperti tas kain. Repair berarti memperbaiki barang rusak agar tetap berfungsi dan tidak terbuang prematurely. Penerapan 5R sehari-hari secara kolektif berdampak besar pada pengurangan jejak karbon dan volume sampah nasional."}, {"paket": "Tryout 1", "mapel": "Bahasa Indonesia", "no": 13, "tipe": "PG", "materi": null, "id_wacana": "BIN-T1-4", "bacaan": "Konsep 5R adalah pengembangan dari 3R yang lebih komprehensif dalam pengelolaan sampah berkelanjutan. Reduce berarti mengurangi pembuatan sampah sejak sumber dengan konsumsi bijak dan hindari barang sekali pakai. Reuse adalah menggunakan kembali barang yang masih layak pakai tanpa mengubah bentuknya. Recycle melibatkan proses daur ulang sampah menjadi bahan baku atau produk baru. Replace mendorong penggantian barang sekali pakai dengan alternatif tahan lama seperti tas kain. Repair berarti memperbaiki barang rusak agar tetap berfungsi dan tidak terbuang prematurely. Penerapan 5R sehari-hari secara kolektif berdampak besar pada pengurangan jejak karbon dan volume sampah nasional.", "gambar": null, "pertanyaan": "Perbedaan Reuse dan Recycle terletak pada…", "opsi_A": "Keduanya sama mengubah bentuk", "opsi_B": "Reuse tidak mengubah bentuk, Recycle mengubah bentuk", "opsi_C": "Reuse mengubah bentuk, Recycle tidak", "opsi_D": "Keduanya tidak mengubah bentuk", "kunci": "B", "pembahasan": "Kalimat ke-4 \"Reuse adalah menggunakan kembali barang yang masih layak pakai tanpa mengubah bentuknya.\" Kalimat ke-5 \"Recycle melibatkan proses daur ulang sampah menjadi bahan baku atau produk baru.\"", "status_cek": "OK", "catatan": null, "wacana_judul": "Gerakan 5R (Reduce, Reuse, Recycle, Replace, Repair)", "wacana_teks": "Konsep 5R adalah pengembangan dari 3R yang lebih komprehensif dalam pengelolaan sampah berkelanjutan. Reduce berarti mengurangi pembuatan sampah sejak sumber dengan konsumsi bijak dan hindari barang sekali pakai. Reuse adalah menggunakan kembali barang yang masih layak pakai tanpa mengubah bentu ik, peleburan di tanur, dan pencetakan ulang. Kaleng minuman aluminium adalah barang daur ulang paling umum dengan siklus cepat: 60 hari dari keranjang sampah kembali ke rak toko. Besi dan baja daur ulang banyak digunakan untuk konstruksi, otomotif, dan peralatan berat. Industri logam daur ulang mengurangi penambangan baru yang merusak ekosistem dan emisi CO2 masif."}, {"paket": "Tryout 1", "mapel": "Bahasa Indonesia", "no": 17, "tipe": "PG", "materi": null, "id_wacana": "BIN-T1-5", "bacaan": "Logam seperti aluminium dan besi merupakan material daur ulang paling efisien karena dapat didaur ulang tanpa batas tanpa mengurangi kualitas. Daur ulang aluminium menghemat 95% energi dibanding ekstraksi dari bijih bauksit. Proses daur ulang logam meliputi pengumpulan, pemilahan magnetik, peleburan di tanur, dan pencetakan ulang. Kaleng minuman aluminium adalah barang daur ulang paling umum dengan siklus cepat: 60 hari dari keranjang sampah kembali ke rak toko. Besi dan baja daur ulang banyak digunakan untuk konstruksi, otomotif, dan peralatan berat. Industri logam daur ulang mengurangi penambangan baru yang merusak ekosistem dan emisi CO2 masif.", "gambar": null, "pertanyaan": "Mengapa besi mudah dipisahkan dari sampah campuran?", "opsi_A": "Ringan", "opsi_B": "Tidak berkarat", "opsi_C": "Bersifat magnetik", "opsi_D": "Harga murah", "kunci": "C", "pembahasan": "Kalimat ke-3: \"pemilahan magnetik\" — besi bersifat ferromagnetik.", "status_cek": "OK", "catatan": null, "wacana_judul": "Daur Ulang Logam (Aluminium & Besi)", "wacana_teks": "Logam seperti aluminium dan besi merupakan material daur ulang paling efisien karena dapat didaur ulang tanpa batas tanpa mengurangi kualitas. Daur ulang aluminium menghemat 95% energi dibanding ekstraksi dari bijih bauksit. Proses daur ulang logam meliputi pengumpulan, pemilahan magnetik, peleburan di tanur, dan pencetakan ulang. Kaleng minuman aluminium adalah barang daur ulang paling umum dengan siklus cepat: 60 hari dari keranjang sampah k ksi, otomotif, dan peralatan berat. Industri logam daur ulang mengurangi penambangan baru yang merusak ekosistem dan emisi CO2 masif."}, {"paket": "Tryout 1", "mapel": "Bahasa Indonesia", "no": 19, "tipe": "Kategori", "materi": null, "id_wacana": "BIN-T1-5", "bacaan": "Logam seperti aluminium dan besi merupakan material daur ulang paling efisien karena dapat didaur ulang tanpa batas tanpa mengurangi kualitas. Daur ulang aluminium menghemat 95% energi dibanding ekstraksi dari bijih bauksit. Proses daur ulang logam meliputi pengumpulan, pemilahan magnetik, peleburan di tanur, dan pencetakan ulang. Kaleng minuman aluminium adalah barang daur ulang paling umum dengan siklus cepat: 60 hari dari keranjang sampah kembali ke rak toko. Besi dan baja daur ulang banyak digunakan untuk konstruksi, otomotif, dan peralatan berat. Industri logam daur ulang mengurangi penambangan baru yang merusak ekosistem dan emisi CO2 masif.", "gambar": null, "pertanyaan": "Benar/Salah:", "opsi_A": "Logam hanya bisa didaur ulang sekali sebelum kualitas turun.", "opsi_B": "Kaleng aluminium daur ulang kembali ke rak toko dalam 60 hari.", "opsi_C": "Daur ulang logam mengurangi aktivitas penambangan baru.", "opsi_D": null, "kunci": "S,B,B", "pembahasan": "(1) Kalimat ke-1: \"dapat didaur ulang tanpa batas tanpa mengurangi kualitas.\" (2) Kalimat ke-4. (3) Kalimat terakhir.", "status_cek": "OK", "catatan": null, "wacana_judul": "Daur Ulang Logam (Aluminium & Besi)", "wacana_teks": "Logam seperti aluminium dan besi merupakan material daur ulang paling efisien karena dapat didaur ulang tanpa batas tanpa mengurangi kualitas. Daur ulang aluminium menghemat 95% energi dibanding ekstraksi dari bijih bauksit. Proses daur ulang logam meliputi pengumpulan, pemilahan magnetik, peleburan di tanur, dan pencetakan ulang. Kaleng minuman aluminium adalah barang daur ulang paling umum dengan siklus cepat: 60 hari dari keranjang sampah kembali ke rak toko. Besi dan baja daur ulang banyak digunakan untuk konstruksi, otomotif, dan peralatan berat. Industri logam daur ulang mengurangi penambangan baru yang merusak ekosistem dan emisi CO2 masif."}, {"paket": "Tryout 1", "mapel": "Bahasa Indonesia", "no": 20, "tipe": "PG", "materi": null, "id_wacana": "BIN-T1-6", "bacaan": "Sampah elektronik atau e-waste adalah perangkat elektronik bekas seperti ponsel, laptop, kulkas, dan TV yang tidak lagi digunakan. E-waste mengandung logam berharga (emas, perak, tembaga, paladium) serta bahan berbahaya (merkuri, timbal, kadmium, brominated flame retardants). Daur ulang e-waste memerlukan teknologi khusus untuk memisahkan komponen berharga dan menetralkan bahan beracun. Pembuangan e-waste sembarangan mencemar tanah, air, dan udara serta membahayakan kesehatan manusia. Indonesia memiliki Peraturan Menteri LHK No. 6 Tahun 2021 tentang pengelolaan sampah elektronik. Program take-back oleh produsen dan pengepul resmi memastikan e-waste diolah di fasilitas berlisensi. Kesadaran masyarakat menyerahkan e-waste ke titik kumpul resmi masih perlu ditingkatkan.", "gambar": null, "pertanyaan": "Bahan berbahaya yang terkandung dalam e-waste:", "opsi_A": "Tembaga dan aluminium", "opsi_B": "Silikon dan plastik", "opsi_C": "Emas dan perak", "opsi_D": "Merkuri, timbal, kadmium", "kunci": "D", "pembahasan": "Kalimat ke-2: \"bahan berbahaya (merkuri, timbal, kadmium, brominated flame retardants).\"", "status_cek": "OK", "catatan": null, "wacana_judul": "Sampah Elektronik (E-Waste) & Daur Ulang", "wacana_teks": "Sampah elektronik atau e-waste adalah perangkat elektronik bekas seperti ponsel, laptop, kulkas, dan TV yang tidak lagi digunakan. E-waste mengandung logam berharga (emas, perak, tembaga, paladium) serta bahan berbahaya (merkuri, timbal, kadmium, brominated flame retardants). Daur ulang e-waste memerlukan teknologi khusus untuk memisahkan komponen berharga dan menetralkan bahan beracun. Pembuangan e-waste sembarangan mencemar tanah, air, dan udara serta membahayakan kesehatan manusia. Indonesia memiliki Pera let chosenSubject = '';
let chosenPaket = '';
let studentName = '';
let quizStarted = false;
let startTime = 0;
let timerId = null;
let violationCount = 0;
let answers = {};

const $ = id => document.getElementById(id);

function goStep(n) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  $('step' + n).classList.add('active');
  // hide timer on non‑quiz steps
  const timerEl = $('timerDisplay');
  if (n === 3) timerEl.style.display = 'block'; else timerEl.style.display = 'none';
  if (n === 3) renderQuestion();
}

function updatePaketOptions() {
  // Reset selected index after populating options
  const subject = $('subjectSelect').value;
  chosenSubject = subject;
  const paketSelect = $('paketSelect');
  paketSelect.innerHTML = '<option value="">-- Pilih Paket --</option>';
  if (!subject) {
    paketSelect.disabled = true;
    return;
  }
  const pakets = [...new Set(allQuestions.filter(q => String(q.mapel).trim().toLowerCase() === String(subject).trim().toLowerCase()).map(q => q.paket))];
  pakets.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    paketSelect.appendChild(opt);
  });
  paketSelect.disabled = false;
}

function handleLogin() {
  studentName = $('studentName').value.trim();
  studentToken = $('studentToken').value.trim();
  if (!studentName || !studentToken) {
    alert('Mohon lengkapi Nama dan Token Akses.');
    return;
  }
  goStep(2);
  $('welcomeText').textContent = `Selamat datang, ${studentName}. Silakan pilih paket ujian.`;
}

function startQuiz(e) {
  if (e) e.preventDefault();
  chosenSubject = $('subjectSelect').value;
  chosenPaket = $('paketSelect').value;
  if (!chosenSubject || !chosenPaket) {
    alert('Mohon pilih Mata Pelajaran dan Paket Soal.');
    return;
  }
  quizStarted = true;
  startTime = Date.now();
  updateTimer();
  timerId = setInterval(updateTimer, 1000);
  $('quizSubject').textContent = chosenSubject;
  $('quizPaket').textContent = chosenPaket;
  answers.currentIndex = 0;
  goStep(3);
  renderQuestion();
  // ensure next/prev button handlers active after first render
  $('#prevBtn').onclick = () => {
    if (answers.currentIndex > 0) {
      answers.currentIndex--;
      renderQuestion();
    }
  };
  $('#doubtBtn').onclick = () => {
    const qIdx = answers.currentIndex;
    const key = `doubt_${qIdx}`;
    answers[key] = !answers[key];
    renderQuestion();
  };
  $('#nextBtn').onclick = () => {
    const qList = allQuestions.filter(q => q.mapel === chosenSubject && q.paket === chosenPaket);
    if (answers.currentIndex < qList.length - 1) {
      answers.currentIndex++;
      renderQuestion();
    } else {
      if (confirm('Apakah Anda yakin ingin mengumpulkan ujian sekarang?')) {
        finishQuiz();
      }
    }
  };
}

function updateTimer() {
  if (!quizStarted) return;
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const remaining = 3600 - elapsed;
  if (remaining <= 0) {
    clearInterval(timerId);
    alert('Waktu ujian telah habis!');
    finishQuiz();
    return;
  }
  const mins = Math.floor(remaining / 60);
  const secs = remaining % 60;
  const timerEl = $('timerDisplay');
  timerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  if (remaining <= 300) {
    timerEl.className = 'timer danger';
  } else if (remaining <= 600) {
    timerEl.className = 'timer warning';
  } else {
    timerEl.className = 'timer';
  }
}

function renderQuestion() {
  const qList = allQuestions.filter(q => q.mapel === chosenSubject && q.paket === chosenPaket);
  const idx = answers.currentIndex || 0;
  answers.currentIndex = idx;
  const q = qList[idx];
  if (!q) return;

  const card = $('questionCard');
  card.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'question-header';
  const num = document.createElement('span');
  num.className = 'question-number';
  num.textContent = `Soal No. ${idx + 1} dari ${qList.length}`;
  
  const typeBadge = document.createElement('span');
  typeBadge.className = 'question-type';
  typeBadge.textContent = q.tipe === 'MCMA' ? 'Pilihan Ganda Kompleks (Pilih >1)' : (q.tipe === 'Kategori' ? 'Pernyataan Benar / Salah' : 'Pilihan Ganda');
  if (q.tipe === 'MCMA') typeBadge.style.color = 'var(--warning)';
  if (q.tipe === 'Kategori') typeBadge.style.color = 'var(--accent)';

  header.appendChild(num);
  header.appendChild(typeBadge);
  card.appendChild(header);

  if (q.id_wacana && q.wacana_teks) {
    const wacanaBlock = document.createElement('div');
    wacanaBlock.className = 'wacana-block';
    wacanaBlock.innerHTML = `<strong style="display:block;margin-bottom:.5rem;color:var(--fg);font-size:1.05rem">📖 ${q.wacana_judul || 'Bacaan Wacana'}</strong><div style="max-height:200px;overflow-y:auto;padding-right:.5rem">${q.wacana_teks}</div>`;
    card.appendChild(wacanaBlock);
  }

  const text = document.createElement('div');
  text.className = 'question-text';
  text.textContent = q.pertanyaan;
  card.appendChild(text);

  const opts = document.createElement('div');
  opts.className = 'options';

  if (q.tipe === 'Kategori') {
    const stList = q.opsi_A ? [q.opsi_A, q.opsi_B, q.opsi_C, q.opsi_D].filter(Boolean) : [];
    const statements = q.statements || stList.map(s => [s, true]);
    statements.forEach((st, sIdx) => {
      const stmtText = Array.isArray(st) ? st[0] : st;
      const item = document.createElement('div');
      item.className = 'kategori-item';
      
      const sp = document.createElement('span');
      sp.textContent = `${sIdx + 1}. ${stmtText}`;
      item.appendChild(sp);

      const btns = document.createElement('div');
      btns.className = 'kategori-btns';

      const btnB = document.createElement('button');
            btnB.textContent = 'Benar';
            const keyB = `cat-${idx}-${sIdx}`;
            if (answers[keyB] === true) btnB.classList.add('active');
            btnB.onclick = () => {
              answers[keyB] = true;
              answers[`locked_${idx}`] = true;
              renderQuestion();
            };

            const btnS = document.createElement('button');
            btnS.textContent = 'Salah';
            if (answers[keyB] === false) btnS.classList.add('active');
            btnS.onclick = () => {
              answers[keyB] = false;
              answers[`locked_${idx}`] = true;
              renderQuestion();
            };

      btns.appendChild(btnB);
      btns.appendChild(btnS);
      item.appendChild(btns);
      opts.appendChild(item);
    });
  } else {
    const optArray = [q.opsi_A, q.opsi_B, q.opsi_C, q.opsi_D].filter(o => o !== null && o !== undefined && o !== '');
    optArray.forEach((opt, oIdx) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      const isSelected = isOptionSelected(idx, oIdx);
      if (isSelected) btn.classList.add('selected');

      const input = document.createElement('input');
      input.type = q.tipe === 'MCMA' ? 'checkbox' : 'radio';
      input.name = 'question_' + idx;
      input.checked = isSelected;
      input.onclick = (e) => e.stopPropagation();

      const letterSpan = document.createElement('span');
      letterSpan.style.fontFamily = "'JetBrains Mono', monospace";
      letterSpan.style.fontWeight = '700';
      letterSpan.style.color = 'var(--accent)';
      letterSpan.textContent = String.fromCharCode(65 + oIdx) + '.';

      const textSpan = document.createElement('span');
      textSpan.className = 'option-label';
      textSpan.textContent = opt;

      btn.appendChild(input);
      btn.appendChild(letterSpan);
      btn.appendChild(textSpan);

      btn.onclick = () => {
        toggleOption(idx, oIdx, q.tipe === 'MCMA');
      };

      opts.appendChild(btn);
    });
  }

  card.appendChild(opts);
  updateNav(idx, qList.length);
  $('#progressText').textContent = `Soal ${idx + 1} dari ${qList.length}`;
  $('#prevBtn').disabled = idx === 0;
  
    const nextBtn = $('#nextBtn'); // keep for compatibility but hide
      const submitBtn = $('#submitBtn');
      const lanBtn = $('#lanjutBtn');
      const finBtn = $('#finishBtn');
      const headerBtn = $('#headerSubmitBtn');
      if (idx === qList.length - 1) {
        // last question: show finish, hide next/lanjut
        lanBtn.style.display = 'none';
        finBtn.style.display = 'inline-block';
        nextBtn.style.display = 'none';
        submitBtn.style.display = 'none';
        headerBtn.style.display = 'inline-block';
      } else {
        // not last: show lanjut, hide finish
        lanBtn.style.display = 'inline-block';
        finBtn.style.display = 'none';
        nextBtn.style.display = 'none';
        submitBtn.style.display = 'none';
        headerBtn.style.display = 'none';
      }
  }

function isOptionSelected(qIdx, optIdx) {
  return !!answers[`${qIdx}-${optIdx}`];
}

function toggleOption(qIdx, optIdx, multi) {
  if (multi) {
    const key = `${qIdx}-${optIdx}`;
    answers[key] = !answers[key];
  } else {
    for (let i = 0; i < 4; i++) {
      delete answers[`${qIdx}-${i}`];
    }
    answers[`${qIdx}-${optIdx}`] = true;
  }
  renderQuestion();
}

function updateNav(current, total) {
  const nav = $('navGrid');
  nav.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const btn = document.createElement('button');
    btn.className = 'nav-btn';
    btn.textContent = i + 1;
    if (i === current) btn.classList.add('current');
    
    const hasAnswered = Object.keys(answers).some(k => k.startsWith(i + '-')) || Object.keys(answers).some(k => k.startsWith('cat-' + i + '-'));
    const isDoubt = !!answers[`doubt_${i}`];

    if (isDoubt) {
      btn.classList.add('doubt');
    } else if (hasAnswered) {
      btn.classList.add('answered');
    }

    btn.onclick = () => {
      answers.currentIndex = i;
      renderQuestion();
    };
    nav.appendChild(btn);
  }
}

$('#prevBtn').onclick = () => {
  if (answers.currentIndex > 0) {
    answers.currentIndex--;
    renderQuestion();
  }
};

$('#nextBtn').onclick = () => {
  const qList = allQuestions.filter(q => q.mapel === chosenSubject && q.paket === chosenPaket);
  if (answers.currentIndex < qList.length - 1) {
    answers.currentIndex++;
    renderQuestion();
  } else {
    if (confirm('Apakah Anda yakin ingin mengumpulkan ujian sekarang?')) {
      finishQuiz();
    }
  }
};

function finishQuiz() {
  quizStarted = false;
  if (timerId) clearInterval(timerId);
  calculateResult();
  goStep(4);
}

function prevQuestion() {
  if (answers.currentIndex > 0) {
    answers.currentIndex--;
    renderQuestion();
  }
}

function nextQuestion() {
  const qList = allQuestions.filter(q => q.mapel === chosenSubject && q.paket === chosenPaket);
  if (answers.currentIndex < qList.length - 1) {
    answers.currentIndex++;
    renderQuestion();
  } else {
    if (confirm('Apakah Anda yakin ingin mengumpulkan ujian sekarang?')) {
      finishQuiz();
    }
  }
}

function toggleDoubt() {
  const idx = answers.currentIndex;
  const key = `doubt_${idx}`;
  answers[key] = !answers[key];
  renderQuestion();
}

function toggleKey() {
  const keyDiv = $('#answerKey');
  if (keyDiv.style.display === 'none' || !keyDiv.innerHTML) {
    const qList = allQuestions.filter(q => q.mapel === chosenSubject && q.paket === chosenPaket);
    let html = '<h3>Kunci Jawaban & Pembahasan</h3><ol style="text-align:left;">';
    qList.forEach((q, idx) => {
      const kunci = q.kunci ? (Array.isArray(q.kunci) ? q.kunci.join(', ') : q.kunci) : 'Tidak ada';
      const pembahasan = q.pembahasan ? q.pembahasan : '';
      html += `<li><strong>No ${q.no}:</strong> ${kunci}<br/>${pembahasan}</li>`;
    });
    html += '</ol>';
    keyDiv.innerHTML = html;
    keyDiv.style.display = 'block';
  } else {
    keyDiv.style.display = 'none';
  }
}
  
function calculateResult() {
  let correct = 0;
  let incorrect = 0;
  let unanswered = 0;

  qList.forEach((q, idx) => {
    if (q.tipe === 'Kategori') {
      const stList = q.opsi_A ? [q.opsi_A, q.opsi_B, q.opsi_C, q.opsi_D].filter(Boolean) : [];
      const statements = q.statements || stList.map(s => [s, true]);
      let answeredAll = true;
      let allCorrect = true;
      let anyAnswered = false;

      statements.forEach((st, sIdx) => {
        const key = `cat-${idx}-${sIdx}`;
        const userAns = answers[key];
        if (userAns !== undefined) anyAnswered = true;
        else answeredAll = false;

        const correctAns = Array.isArray(st) ? st[1] : true;
        if (userAns !== correctAns) allCorrect = false;
      });

      if (!anyAnswered) {
        unanswered++;
      } else if (allCorrect) {
        correct++;
      } else {
        incorrect++;
      }
    } else {
      const keyPrefix = `${idx}-`;
      const selectedOpts = [];
      for (let i = 0; i < 4; i++) {
        if (answers[`${idx}-${i}`]) {
          selectedOpts.push(String.fromCharCode(65 + i));
        }
      }

      if (selectedOpts.length === 0) {
        unanswered++;
      } else {
        const kunciArr = Array.isArray(q.kunci) ? q.kunci : q.kunci.split(',').map(s => s.trim());
        selectedOpts.sort();
        kunciArr.sort();
        const isMatch = selectedOpts.length === kunciArr.length && selectedOpts.every((val, i) => val === kunciArr[i]);
        if (isMatch) correct++;
        else incorrect++;
      }
    }
  });

  $('resultStudentInfo').textContent = `${studentName} — ${chosenSubject} (${chosenPaket})`;
  $('resultScore').textContent = `${correct}/${qList.length}`;
  $('statCorrect').textContent = correct;
  $('statIncorrect').textContent = incorrect;
  $('statUnanswered').textContent = unanswered;
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && quizStarted) {
    handleViolation();
  }
});
window.addEventListener('blur', () => {
  if (quizStarted) {
    handleViolation();
  }
});

function handleViolation() {
  violationCount++;
  if (violationCount >= 3) {
    alert('Peringatan: Anda telah berpindah tab/keluar sebanyak 3 kali. Sesi ujian diakhiri dan dinyatakan NULL (Didiskualifikasi).');
    quizStarted = false;
    if (timerId) clearInterval(timerId);
    $('resultStudentInfo').textContent = `${studentName} — ${chosenSubject} (${chosenPaket}) [DIDISKUALIFIKASI]`;
    $('resultScore').textContent = 'NULL';
    $('statCorrect').textContent = '0';
    $('statIncorrect').textContent = '0';
    $('statUnanswered').textContent = '30';
    goStep(4);
  } else {
    alert('PERINGATAN PELANGGARAN (' + violationCount + '/3)\nJangan berpindah tab atau keluar dari halaman ujian! Pelanggaran ke-3 akan mengakibatkan nilai ujian menjadi NULL.');
  }
}

$('loginForm').addEventListener('submit', handleLogin);
$('subjectSelect').onchange = updatePaketOptions;

</script>
