
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo SmartDrill SD 2026 – 10 Soal Interaktif (Evaluasi Akhir)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body {font-family: 'Plus Jakarta Sans', sans-serif;}</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <span class="text-xl font-bold">🚀 SmartDrill SD 2026 - DEMO</span>
            <a href="index.html" class="text-xs bg-indigo-500 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg font-semibold transition">Kembali ke Utama</a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8 w-full flex-grow">
        <div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-4 mb-6 text-center">
            <h2 class="text-lg font-bold text-indigo-900 mb-1">Coba Uji Coba Gratis (10 Soal Sampel)</h2>
            <p class="text-xs text-indigo-700">Rasakan pengalaman CBT interaktif lengkap dengan evaluasi akhir.</p>
        </div>

        <div id="quiz-container" class="bg-white rounded-2xl shadow-lg p-6 sm:p-8 mb-6">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <span id="quiz-info" class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full"></span>
                <span id="quiz-counter" class="text-sm font-bold text-slate-500"></span>
            </div>
            <div class="mb-6"><p id="quiz-question" class="text-slate-900 font-medium text-base sm:text-lg leading-relaxed whitespace-pre-line"></p></div>
            <div id="quiz-options" class="space-y-3 mb-6"></div>
            <div class="flex justify-between pt-4 border-t border-slate-100">
                <button id="btn-prev" onclick="prevQuestion()" class="px-4 py-2 rounded-xl border border-slate-300 font-semibold text-slate-600 hover:bg-slate-50 transition text-sm" style="display:none;">Sebelumnya</button>
                <button id="btn-next" onclick="nextOrFinish()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition shadow-md text-sm">Selanjutnya</button>
            </div>
        </div>

        <div id="result-section" class="hidden bg-white rounded-2xl shadow-lg p-6 sm:p-8">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-3">🎉</div>
                <h2 class="text-2xl font-bold text-slate-900 mb-2">Demo Selesai!</h2>
                <p id="score-summary" class="text-slate-600 text-sm mb-4"></p>
            </div>
            <div id="detail-list" class="space-y-6"></div>
            <div class="text-center mt-6">
                <a href="https://lynk.id" target="_blank" class="inline-block bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl transition shadow-lg shadow-emerald-100 text-sm">Dapatkan Paket Lengkap Sekarang</a>
                <button onclick="location.reload()" class="ml-4 text-sm text-indigo-600 font-semibold hover:underline">Ulangi Demo</button>
            </div>
        </div>
    </main>

    <footer class="text-center py-6 text-xs text-slate-400">SmartDrill SD 2026 • Demo Ujian Interaktif</footer>

    <script>
        let questions = [];
        let currentIdx = 0;
        const userAnswers = {};

        fetch('demo_questions.json')
            .then(r => r.json())
            .then(data => {questions = data; renderQuestion();})
            .catch(e => alert('Gagal memuat soal demo: '+e));

        function renderQuestion(){
            const q = questions[currentIdx];
            document.getElementById('quiz-info').innerText = `${q.subject || 'Materi'} - Demo`;
            document.getElementById('quiz-counter').innerText = `Soal ${currentIdx+1} dari ${questions.length}`;
            document.getElementById('quiz-question').innerText = q.question;
            const optDiv = document.getElementById('quiz-options');
            optDiv.innerHTML = '';
            const multi = Array.isArray(q.correct);
            const letters = ['A','B','C','D','E'];
            q.options.forEach((opt, i) => {
                const wrapper = document.createElement('label');
                wrapper.className = 'flex items-start space-x-2 cursor-pointer';
                const input = document.createElement('input');
                input.type = multi ? 'checkbox' : 'radio';
                input.name = 'answer';
                input.value = multi ? letters[i] : letters[i];
                input.className = 'mt-1';
                // pre‑select
                if(userAnswers[currentIdx]){
                    if(multi && userAnswers[currentIdx].includes(letters[i])) input.checked = true;
                    if(!multi && userAnswers[currentIdx]===letters[i]) input.checked = true;
                }
                const txt = document.createElement('span');
                // For true/false multiple statements (question 1 & 3), hide the letter prefix
                if(q.type === 'true_false_multiple'){
                    txt.innerHTML = opt; // option already contains full statement
                } else {
                    txt.innerHTML = `<strong>${letters[i]}.</strong> ${opt}`;
                }
                wrapper.appendChild(input);
                wrapper.appendChild(txt);
                optDiv.appendChild(wrapper);
            });
            document.getElementById('btn-prev').style.display = currentIdx===0 ? 'none' : 'inline-block';
            document.getElementById('btn-next').innerText = (currentIdx===questions.length-1) ? 'Selesaikan Demo' : 'Selanjutnya';
        }

        function saveCurrentAnswer(){
            const inputs = document.querySelectorAll('#quiz-options input');
            const multi = Array.isArray(questions[currentIdx].correct);
            if(multi){
                const selected = [];
                inputs.forEach(inp=>{if(inp.checked) selected.push(inp.value)});
                userAnswers[currentIdx] = selected;
            } else {
                let selected = null;
                inputs.forEach(inp=>{if(inp.checked) selected = inp.value});
                userAnswers[currentIdx] = selected;
            }
        }

        function prevQuestion(){
            saveCurrentAnswer();
            if(currentIdx>0){
                currentIdx--;
                renderQuestion();
            }
        }

        function nextOrFinish(){
            saveCurrentAnswer();
            if(currentIdx < questions.length-1){
                currentIdx++;
                renderQuestion();
            } else {
                showResult();
            }
        }

        function showResult(){
            document.getElementById('quiz-container').classList.add('hidden');
            const resultSec = document.getElementById('result-section');
            resultSec.classList.remove('hidden');
            let correctCount = 0;
            const detailDiv = document.getElementById('detail-list');
            detailDiv.innerHTML = '';
            questions.forEach((q, idx)=>{
                const userAns = userAnswers[idx];
                let isCorrect = false;
                if(Array.isArray(q.correct)){
                    const correctSet = new Set(q.correct);
                    const userSet = new Set(userAns||[]);
                    isCorrect = correctSet.size===userSet.size && [...correctSet].every(v=>userSet.has(v));
                } else {
                    isCorrect = q.correct===userAns;
                }
                if(isCorrect) correctCount++;
                // detail item
                const letters = ['A','B','C','D','E'];
                const userDisp = Array.isArray(userAns) ? userAns.join(', ') : (userAns||'---');
                const correctDisp = Array.isArray(q.correct) ? q.correct.join(', ') : q.correct;
                const item = document.createElement('div');
                item.className = 'border border-slate-200 rounded-lg p-4';
                item.innerHTML = `
                    <p class="font-semibold mb-1">${idx+1}. ${q.question}</p>
                    <p class="text-sm mb-1"><span class="font-medium">Jawaban Anda:</span> ${userDisp}</p>
                    <p class="text-sm mb-1"><span class="font-medium">Benar:</span> ${correctDisp}</p>
                    <p class="text-sm ${isCorrect? 'text-emerald-700' : 'text-rose-700'}"><strong>${isCorrect? '✅ Benar' : '❌ Salah'}</strong></p>
                    <p class="mt-2 text-sm whitespace-pre-line"><strong>Pembahasan:</strong> ${q.explanation}</p>
                `;
                detailDiv.appendChild(item);
            });
            document.getElementById('score-summary').innerText = `Anda menjawab benar ${correctCount} dari ${questions.length} soal demo.`;
        }
    </script>
</body>
</html>
