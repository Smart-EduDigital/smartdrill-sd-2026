<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo SmartDrill SD 2026 – 10 Soal Interaktif</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {font-family: 'Plus Jakarta Sans', sans-serif;}
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">
    <h1 class="text-2xl font-bold mb-4">Demo 10 Soal Interaktif</h1>
    <p class="mb-2 text-center">Berikut 5 soal Matematika & 5 soal Bahasa Indonesia. Tidak memerlukan token, langsung coba!</p>
    <script>
        // Load demo questions (generated earlier)
        fetch('demo_questions.json')
            .then(r=>r.json())
            .then(data=>runDemo(data))
            .catch(e=>alert('Gagal memuat demo: '+e));

        function runDemo(questions){
            let idx=0;
            const container=document.createElement('div');
            container.className='w-full max-w-2xl bg-white rounded-2xl shadow-lg p-6';
            document.body.appendChild(container);
            renderQuestion();
            function renderQuestion(){
                const q=questions[idx];
                container.innerHTML=`<h2 class='text-lg font-semibold mb-2'>Soal ${q.number} / ${questions.length}</h2>
                    <p class='mb-4'>${q.question}</p>`;
                const optsDiv=document.createElement('div');
                optsDiv.className='space-y-2';
                q.options.forEach((opt,i)=>{
                    const btn=document.createElement('button');
                    btn.type='button';
                    btn.className='w-full px-4 py-2 bg-indigo-100 hover:bg-indigo-200 rounded';
                    btn.textContent=opt;
                    btn.onclick=()=>{alert('Jawaban terpilih: '+opt); advance();};
                    optsDiv.appendChild(btn);
                });
                container.appendChild(optsDiv);
            }
            function advance(){
                idx++;
                if(idx<questions.length) renderQuestion();
                else alert('Demo selesai!');
            }
        }
    </script>
</body>
</html>
