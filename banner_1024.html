<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Banner Generator 1024x1024 Lynk.id</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">
    <div id="banner" class="w-[1024px] h-[1024px] bg-gradient-to-br from-indigo-950 via-slate-900 to-indigo-900 text-white p-16 flex flex-col justify-between relative overflow-hidden shadow-2xl">
        <!-- Background Glow -->
        <div class="absolute -top-32 -right-32 w-96 h-96 bg-indigo-600/30 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-32 -left-32 w-96 h-96 bg-emerald-500/20 rounded-full blur-3xl"></div>

        <!-- Header Tag -->
        <div class="z-10 flex justify-between items-center">
            <span class="bg-indigo-500/30 border border-indigo-400/40 text-indigo-300 px-6 py-2.5 rounded-full text-xl font-bold tracking-wide">
                🚀 KURIKULUM TERBARU 2026
            </span>
            <span class="text-emerald-400 font-extrabold text-2xl">SD / MI</span>
        </div>

        <!-- Main Title & Value Prop -->
        <div class="z-10 my-auto text-center space-y-6">
            <h1 class="text-6xl font-black tracking-tight leading-tight">
                SmartDrill SD <span class="text-emerald-400">2026</span>
            </h1>
            <p class="text-2xl text-slate-300 max-w-2xl mx-auto font-medium leading-relaxed">
                Paket Eksklusif 10 Worksheet Cetak + Platform Try Out CBT Interaktif (Matematika & Bahasa Indonesia)
            </p>
            <div class="flex justify-center gap-4 pt-4">
                <div class="bg-white/10 backdrop-blur-md px-6 py-4 rounded-2xl border border-white/10 text-center">
                    <p class="text-3xl font-extrabold text-indigo-300">60 Soal</p>
                    <p class="text-sm text-slate-400">Per Paket VIP</p>
                </div>
                <div class="bg-white/10 backdrop-blur-md px-6 py-4 rounded-2xl border border-white/10 text-center">
                    <p class="text-3xl font-extrabold text-emerald-400">60 Menit</p>
                    <p class="text-sm text-slate-400">Timer Ujian</p>
                </div>
                <div class="bg-white/10 backdrop-blur-md px-6 py-4 rounded-2xl border border-white/10 text-center">
                    <p class="text-3xl font-extrabold text-amber-400">Auto</p>
                    <p class="text-sm text-slate-400">Token & Skor</p>
                </div>
            </div>
        </div>

        <!-- Footer Call to Action -->
        <div class="z-10 bg-indigo-600/90 py-5 px-8 rounded-3xl flex justify-between items-center shadow-xl border border-indigo-400/30">
            <div>
                <p class="text-sm text-indigo-200 font-semibold">Siap Hadapi Ujian Sekolah</p>
                <p class="text-2xl font-extrabold">Akses Instan & Seumur Hidup</p>
            </div>
            <div class="bg-white text-indigo-900 px-8 py-3.5 rounded-2xl font-black text-lg shadow">
                Beli Sekarang ➔
            </div>
        </div>
    </div>
</body>
</html>
